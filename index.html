<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PulseCoach</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <h1 id="title" class="brand">PulseCoach</h1>
        <div class="controls">
          <span id="beat-dot" class="beat-dot" aria-hidden="true"></span>
          <button id="metronome-toggle" class="btn" type="button" aria-pressed="false">Metronome off</button>
        </div>
      </header>
      <main class="practice">
        <div id="stage" class="stage-panel"></div>
        <div id="hud" class="hud"></div>
      </main>
      <footer id="footer" class="footer"></footer>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
