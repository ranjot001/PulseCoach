<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PulseCoach · CPR compression practice</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0f14'/%3E%3Cpath d='M3 17h6l3-8 5 15 4-11 2 4h6' fill='none' stroke='%2322c55e' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <h1 id="title" class="brand">PulseCoach</h1>
        <div id="timer" class="timer" hidden></div>
        <div class="controls">
          <span id="beat-dot" class="beat-dot" aria-hidden="true"></span>
          <button id="metronome-toggle" class="btn" type="button" aria-pressed="false">Metronome off</button>
          <button id="voice-toggle" class="btn" type="button" aria-pressed="false">Voice on</button>
        </div>
      </header>
      <main id="screen-home" class="screen home"></main>
      <main id="screen-session" class="screen practice" hidden>
        <div id="stage" class="stage-panel"></div>
        <div id="hud" class="hud"></div>
        <div id="countdown" class="countdown" hidden>
          <div id="countdown-number" class="countdown-number"></div>
        </div>
      </main>
      <main id="screen-results" class="screen results" hidden></main>
      <main id="screen-error" class="screen error" hidden></main>
      <footer id="footer" class="footer"></footer>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
